[project]
name = "nidl"
version = "0.4.0"
description = "Network Intelligence Definition Language runtime"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2", "httpx>=0.27", "pyyaml>=6", "jsonschema>=4"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
starrocks = ["pymysql>=1.1"]
temporal = ["temporalio>=1.8,<2"]

[project.scripts]
nidl-temporal-worker = "nidl.temporal_runtime:main"
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["nidl*"]
[tool.pytest.ini_options]
pythonpath = ["."]
