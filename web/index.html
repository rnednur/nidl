<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NIDL Network Intelligence</title>
  <style>
    :root{--navy:#071624;--panel:#0d2133;--ink:#172434;--muted:#66788b;--line:#dce4ea;--bg:#f4f7f9;--white:#fff;--teal:#00a58e;--cyan:#3bc6d4;--orange:#f49b45;--red:#dd5963;--blue:#3267d6;--shadow:0 10px 30px rgba(22,42,65,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
    aside{position:sticky;top:0;height:100vh;background:var(--navy);color:#dce8f0;padding:26px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px}.mark{width:34px;height:34px;border:1px solid #3bc6d4;border-radius:9px;display:grid;place-items:center;color:var(--cyan);font-size:18px}.brand b{display:block;color:white;font-size:16px;letter-spacing:.08em}.brand small{color:#7892a5}.nav-label{text-transform:uppercase;letter-spacing:.12em;color:#668196;font-size:10px;padding:16px 12px 8px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#9fb3c2;border-radius:8px;padding:10px 12px;margin:2px 0}.nav button:hover,.nav button.active{background:#143149;color:white}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}.nav i{font-style:normal;display:inline-block;width:25px}.environment{margin-top:auto;border-top:1px solid #18354a;padding:18px 10px 0;color:#7f9aad}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#32c69a;margin-right:7px}
    main{min-width:0}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.breadcrumbs{color:var(--muted)}.breadcrumbs strong{color:var(--ink)}.top-actions{display:flex;gap:10px;align-items:center}.search{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:240px}.avatar{width:34px;height:34px;border-radius:50%;background:#dff5f1;color:#087c6c;display:grid;place-items:center;font-weight:700}
    .content{padding:30px 34px 60px;max-width:1500px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.page-head h1{font-size:26px;line-height:1.15;margin:0 0 7px;letter-spacing:-.025em}.page-head p{margin:0;color:var(--muted)}.btn{border:1px solid transparent;border-radius:8px;padding:9px 14px;font-weight:650;background:var(--teal);color:white}.btn:hover{filter:brightness(.95)}.btn.secondary{background:white;border-color:var(--line);color:var(--ink)}.btn.danger{background:#fff1f1;color:#b74049;border-color:#f3c7cb}.btn.small{padding:6px 10px;font-size:12px}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.metric{background:white;border:1px solid var(--line);border-radius:11px;padding:18px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}.metric .value{font-size:28px;font-weight:720;margin-top:7px}.metric .hint{font-size:12px;color:#79909f;margin-top:3px}.metric.warn .value{color:var(--orange)}
    .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}.card{background:white;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);overflow:auto}.card-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;min-width:max-content}.card-head h2{font-size:15px;margin:0}.card-body{padding:18px}.empty{padding:46px 20px;text-align:center;color:var(--muted)}
    table{width:100%;border-collapse:collapse}th{text-align:left;padding:11px 13px;color:#718294;font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:#f8fafb;border-bottom:1px solid var(--line)}td{padding:13px;border-bottom:1px solid #e8edf1;vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcfd}.name{font-weight:660}.subtle{color:var(--muted);font-size:12px}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 8px;background:#eaf6f3;color:#097a69;font-weight:650;font-size:11px}.pill.warn{background:#fff1e4;color:#a25b18}.pill.bad{background:#fdebed;color:#af3944}.pill.neutral{background:#eef2f6;color:#53697d}.sev{width:5px;height:34px;border-radius:5px;background:var(--orange);display:inline-block;vertical-align:middle;margin-right:9px}.actions{display:flex;gap:6px;justify-content:flex-end}
    .activity{display:grid;gap:14px}.activity-item{display:grid;grid-template-columns:10px 1fr;gap:12px}.activity-line{position:relative}.activity-line:before{content:"";position:absolute;top:12px;bottom:-20px;left:3px;width:1px;background:var(--line)}.activity-item:last-child .activity-line:before{display:none}.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);margin-top:6px;position:relative}.activity-item b{font-size:13px}.activity-item p{margin:2px 0;color:var(--muted);font-size:12px}
    .modal{position:fixed;inset:0;background:rgba(3,14,24,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}.modal.open{display:flex}.dialog{width:min(880px,100%);max-height:92vh;background:white;border-radius:13px;box-shadow:0 30px 80px rgba(0,0,0,.25);display:flex;flex-direction:column}.dialog-head,.dialog-foot{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.dialog-foot{border-top:1px solid var(--line);border-bottom:0}.dialog-head h2{margin:0;font-size:17px}.dialog-body{padding:20px;overflow:auto}.editor{width:100%;min-height:420px;resize:vertical;border:1px solid #bfcbd5;background:#f8fafb;border-radius:8px;padding:14px;font:12px/1.55 ui-monospace,monospace;tab-size:2}.result{border-radius:8px;background:#0b1e2e;color:#d8ebf4;padding:12px;white-space:pre-wrap;max-height:180px;overflow:auto;margin-top:12px;display:none}.toast{position:fixed;right:24px;bottom:24px;background:#102638;color:white;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;z-index:9}.toast.show{opacity:1;transform:none}.split-title{display:flex;align-items:center;gap:10px}.spark{height:42px;display:flex;align-items:end;gap:3px}.spark span{width:5px;background:#78d6ca;border-radius:2px 2px 0 0}
    @media(max-width:1000px){.app{grid-template-columns:76px 1fr}.brand div,.nav span,.nav-label,.environment{display:none}.brand{padding-left:2px}.nav i{width:auto}.nav button{text-align:center}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}aside{height:auto;position:static;flex-direction:row;padding:10px}.brand{padding:0}.nav{display:flex;margin-left:auto}.nav button{width:auto}.topbar{padding:0 16px}.search{display:none}.content{padding:22px 16px}.metrics{grid-template-columns:1fr 1fr}.page-head{gap:14px}.hide-mobile{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="mark">◇</div><div><b>NIDL</b><small>Network intelligence</small></div></div>
    <div class="nav-label">Operations</div>
    <nav class="nav" id="nav">
      <button data-page="overview" class="active" aria-label="Overview"><i>⌂</i><span>Overview</span></button>
      <button data-page="workflows" aria-label="Workflows"><i>⌁</i><span>Workflows</span></button>
      <button data-page="incidents" aria-label="Incidents"><i>△</i><span>Incidents</span></button>
      <button data-page="runs" aria-label="Execution runs"><i>▷</i><span>Execution runs</span></button>
      <button data-page="subscriptions" aria-label="Subscriptions"><i>◉</i><span>Subscriptions</span></button>
      <button data-page="agent" aria-label="Agent desk"><i>✦</i><span>Agent desk</span></button>
      <button data-page="wakeups" aria-label="Wake-ups"><i>↻</i><span>Wake-ups</span></button>
      <button data-page="deliveries" aria-label="Deliveries"><i>↗</i><span>Deliveries</span></button>
    </nav>
    <div class="environment"><span class="dot"></span>Local environment<br><small>API v0.4.0 · Temporal</small></div>
  </aside>
  <main>
    <header class="topbar"><div class="breadcrumbs">Network intelligence / <strong id="crumb">Overview</strong></div><div class="top-actions"><input class="search" placeholder="Search workflows and incidents"><div class="avatar">ND</div></div></header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="modal" id="editorModal"><div class="dialog"><div class="dialog-head"><h2>Publish workflow</h2><button class="btn secondary small" onclick="closeEditor()">Close</button></div><div class="dialog-body"><textarea class="editor" id="definition" spellcheck="false"></textarea><pre class="result" id="validationResult"></pre></div><div class="dialog-foot"><button class="btn secondary" onclick="validateWorkflow()">Validate & preview</button><button class="btn" onclick="publishWorkflow()">Publish version</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const example={apiVersion:"network.ai/v1",kind:"NetworkWorkflow",metadata:{name:"ran-harq-degradation",version:"1.0.0",owner:"ran-performance"},parameters:{market:{type:"market_ref",required:true},min_users:{type:"integer",default:100,min:0}},triggers:[{type:"schedule",cron:"*/15 * * * *",timezone:"America/New_York"}],steps:[{id:"kpis",uses:"data.inline@1",with:{rows:[{cell_id:"A1",harq_failure_rate:.22,throughput_delta_pct:-40,estimated_users:500},{cell_id:"A2",harq_failure_rate:.02,throughput_delta_pct:-5,estimated_users:100}]}},{id:"detect",uses:"analytics.rules@1",needs:["kpis"],with:{source:"${steps.kpis.rows}",all:[{field:"harq_failure_rate",op:"gt",value:.15}]}},{id:"impact",uses:"network.impact@1",needs:["detect"],with:{cells:"${steps.detect.rows}"}},{id:"incident",uses:"incident.upsert@1",needs:["impact"],with:{key:"ran_harq_cell_episode",evidence:"${steps.impact.result}",severity:3}}],outputs:{incident:"${steps.incident.id}",impact:"${steps.impact.result}"},presentation_ref:"ran.harq.detail@1"};
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=value=>value?new Date(value).toLocaleString():"—";
async function api(path,options={}){const response=await fetch(path,{headers:{"Content-Type":"application/json"},...options});let body;try{body=await response.json()}catch{body={detail:response.statusText}}if(!response.ok)throw Error(typeof body.detail==="string"?body.detail:JSON.stringify(body.detail||body));return body}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600)}
function status(value){const bad=["FAILED","DEGRADING"].includes(value),warn=["NEW","RECOVERING","PENDING"].includes(value);return `<span class="pill ${bad?'bad':warn?'warn':'neutral'}">${esc(value)}</span>`}
function pageHead(title,subtitle,action=""){return `<div class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}
function empty(label){return `<div class="empty">No ${label} yet.</div>`}
function parseBody(row){return typeof row.body==="string"?JSON.parse(row.body):row.body}

async function overview(){const [summary,incidents,runs]=await Promise.all([api('/v1/dashboard'),api('/v1/incidents'),api('/v1/runs')]);return `${pageHead('Network operations','Live intelligence across approved workflows and market scopes','<button class="btn" onclick="openEditor()">+ New workflow</button>')}<div class="metrics"><div class="metric"><div class="label">Published workflows</div><div class="value">${summary.workflows}</div><div class="hint">Versioned definitions</div></div><div class="metric warn"><div class="label">Active incidents</div><div class="value">${summary.active_incidents}</div><div class="hint">Across authorized markets</div></div><div class="metric"><div class="label">Runs in 24 hours</div><div class="value">${summary.runs_24h}</div><div class="hint">Manual and scheduled</div></div><div class="metric"><div class="label">Subscriptions</div><div class="value">${summary.subscriptions}</div><div class="hint">Personalized policies</div></div></div><div class="grid"><div class="card"><div class="card-head"><h2>Active incident queue</h2><button class="btn secondary small" onclick="navigate('incidents')">View all</button></div>${incidents.length?incidentTable(incidents.slice(0,6)):empty('active incidents')}</div><div class="card"><div class="card-head"><h2>Recent execution activity</h2></div><div class="card-body activity">${runs.length?runs.slice(0,6).map(r=>`<div class="activity-item"><div class="activity-line"><div class="activity-dot"></div></div><div><b>${esc(r.workflow_id||'Workflow run')}</b><p>${status(r.status)} · ${date(r.created)}</p></div></div>`).join(''):empty('runs')}</div></div></div>`}
function incidentTable(rows){return `<table><thead><tr><th>Incident</th><th>Market</th><th>State</th><th>Impact</th><th>Updated</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="sev"></span><span class="name mono">${esc(r.id.slice(0,8))}</span><div class="subtle">Severity ${r.severity}</div></td><td>${esc(r.market)}</td><td>${status(r.status)}</td><td><b>${Number(r.affected_users||0).toLocaleString()}</b> users</td><td class="subtle">${date(r.updated)}</td></tr>`).join('')}</tbody></table>`}
async function workflows(){const rows=await api('/v1/workflows');return `${pageHead('Workflow registry','Validated, immutable network intelligence definitions','<button class="btn" onclick="openEditor()">+ Publish workflow</button>')}<div class="card">${rows.length?`<table><thead><tr><th>Name</th><th>Owner</th><th>Version</th><th>Plan</th><th>Created</th><th></th></tr></thead><tbody>${rows.map(r=>{const b=parseBody(r),p=r.compiled||{};return `<tr><td><div class="name">${esc(b.metadata.name)}</div><div class="subtle mono">${esc(r.id.slice(0,12))}</div></td><td>${esc(b.metadata.owner)}</td><td><span class="pill neutral">v${esc(b.metadata.version)}</span></td><td><b>${p.step_count||b.steps.length}</b> steps · ${p.estimated_cost_units||'—'} units</td><td class="subtle">${date(r.created)}</td><td><div class="actions"><button class="btn secondary small" onclick="runWorkflow('${esc(r.id)}',true)">Dry run</button><button class="btn secondary small" onclick="runWorkflow('${esc(r.id)}',false)">Local</button><button class="btn small" onclick="runDurable('${esc(r.id)}')">Temporal</button></div></td></tr>`}).join('')}</tbody></table>`:empty('workflows')}</div>`}
async function incidents(){const rows=await api('/v1/incidents');return `${pageHead('Incident intelligence','Correlated episodes with lifecycle, evidence, and impact')}<div class="card">${rows.length?incidentTable(rows):empty('incidents')}</div>`}
async function runs(){const rows=await api('/v1/runs');return `${pageHead('Execution runs','Local and Temporal executions with durable status and failure evidence')}<div class="card">${rows.length?`<table><thead><tr><th>Run</th><th>Workflow</th><th>Engine</th><th>Status</th><th>Steps</th><th>Started</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.id.slice(0,12))}</td><td class="mono">${esc((r.workflow_id||'').slice(0,12))}</td><td>${esc(r.result?.orchestrator||'local')}</td><td>${status(r.status)}</td><td>${r.result?.diagnostics?.length||0}</td><td class="subtle">${date(r.created)}</td><td>${['PENDING','RUNNING'].includes(r.status)&&r.result?.orchestrator==='temporal'?`<button class="btn danger small" onclick="cancelDurable('${esc(r.id)}')">Cancel</button>`:''}</td></tr>`).join('')}</tbody></table>`:empty('runs')}</div>`}
async function subscriptions(){const rows=await api('/v1/subscriptions');return `${pageHead('Subscriptions','Versioned market watches with preview, confirmation, and adaptive delivery')}<div class="card">${rows.length?`<table><thead><tr><th>Owner</th><th>Market</th><th>Evaluation</th><th>Channel</th><th>Status</th><th>Version</th><th></th></tr></thead><tbody>${rows.map(r=>{const b=parseBody(r),state=(b.status||(b.enabled?'active':'paused')).toUpperCase(),next=state==='ACTIVE'?'paused':'active';return `<tr><td><div class="name">${esc(b.owner)}</div><div class="subtle mono">${esc(r.id.slice(0,10))}</div></td><td>${esc(b.market)}</td><td>Every ${esc(b.evaluation?.every_minutes||15)}m</td><td>${esc(b.channel)}</td><td>${status(state)}</td><td>v${r.version}</td><td><button class="btn secondary small" onclick="changeSubscription('${esc(r.id)}','${next}')">${next==='paused'?'Pause':'Resume'}</button></td></tr>`}).join('')}</tbody></table>`:empty('subscriptions')}</div>`}
async function agent(){const [profile,activity]=await Promise.all([api('/v1/agent/profile'),api('/v1/agent/activity')]);return `${pageHead('Personal agent desk','Preview and confirm bounded subscription actions; scheduled checks remain deterministic')}<div class="grid"><div class="card"><div class="card-head"><h2>Conversational job management</h2></div><div class="card-body"><label class="subtle" for="agentCommand">Try “watch atlanta using ran-harq-degradation” or “pause subscription …”</label><textarea class="editor" id="agentCommand" style="min-height:120px;margin-top:8px" placeholder="Describe the watch you want to manage"></textarea><div style="margin-top:12px"><button class="btn" onclick="previewCommand()">Preview action</button> <button class="btn secondary" id="confirmCommand" onclick="confirmCommand()" disabled>Confirm</button></div><pre class="result" id="agentResult"></pre></div></div><div class="card"><div class="card-head"><h2>Scoped profile and activity</h2></div><div class="card-body"><div class="subtle">Principal</div><div class="name">${esc(profile.principal_id)}</div><div class="activity" style="margin-top:20px">${activity.length?activity.slice(0,8).map(a=>`<div class="activity-item"><div class="activity-line"><div class="activity-dot"></div></div><div><b>${esc(a.activity_type)}</b><p>${date(a.created)}</p></div></div>`).join(''):empty('agent activity')}</div></div></div></div>`}
async function wakeups(){const rows=await api('/v1/wakeups');return `${pageHead('Wake-up dispatcher','Idempotent schedule, signal, material-change, and recovery events','<button class="btn secondary" onclick="tickScheduler()">Run scheduler tick</button>')}<div class="card">${rows.length?`<table><thead><tr><th>Event</th><th>Source</th><th>Status</th><th>Evaluation key</th><th>Created</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.id.slice(0,16))}</td><td>${esc(r.source)}</td><td>${status(r.status)}</td><td class="mono">${esc((r.evaluation_key||'—').slice(0,16))}</td><td class="subtle">${date(r.created)}</td></tr>`).join('')}</tbody></table>`:empty('wake-up events')}</div>`}
async function deliveries(){const rows=await api('/v1/deliveries');return `${pageHead('Delivery outbox','Idempotent inbox, email, and Slack notification records')}<div class="card">${rows.length?`<table><thead><tr><th>Delivery</th><th>Incident</th><th>Channel</th><th>Status</th><th>Reason</th><th>Created</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.id.slice(0,10))}</td><td class="mono">${esc(r.incident_id.slice(0,10))}</td><td>${esc(r.channel)}</td><td>${status(r.status)}</td><td class="subtle">${esc(r.reason||'—')}</td><td class="subtle">${date(r.created)}</td></tr>`).join('')}</tbody></table>`:empty('deliveries')}</div>`}
const pages={overview,workflows,incidents,runs,subscriptions,agent,wakeups,deliveries};
async function navigate(name){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));document.getElementById('crumb').textContent=name[0].toUpperCase()+name.slice(1);const el=document.getElementById('content');el.innerHTML='<div class="empty">Loading intelligence…</div>';try{el.innerHTML=await pages[name]()}catch(error){el.innerHTML=`${pageHead('Unable to load','The API returned an error')}<div class="card"><div class="empty">${esc(error.message)}</div></div>`}}
document.getElementById('nav').addEventListener('click',event=>{const button=event.target.closest('button[data-page]');if(button)navigate(button.dataset.page)});
function openEditor(){document.getElementById('definition').value=JSON.stringify(example,null,2);document.getElementById('validationResult').style.display='none';document.getElementById('editorModal').classList.add('open')}
function closeEditor(){document.getElementById('editorModal').classList.remove('open')}
async function validateWorkflow(){const out=document.getElementById('validationResult');out.style.display='block';try{out.textContent=JSON.stringify(await api('/v1/workflows/validate',{method:'POST',body:document.getElementById('definition').value}),null,2)}catch(error){out.textContent=error.message}}
async function publishWorkflow(){try{const result=await api('/v1/workflows',{method:'POST',body:document.getElementById('definition').value});closeEditor();toast(`Published plan ${result.plan.plan_id}`);navigate('workflows')}catch(error){const out=document.getElementById('validationResult');out.style.display='block';out.textContent=error.message}}
async function runWorkflow(id,dry){try{const result=await api(`/v1/workflows/${id}/run`,{method:'POST',body:JSON.stringify({parameters:{market:'demo'},dry_run:dry})});toast(`${dry?'Dry run':'Run'} succeeded · ${result.id.slice(0,8)}`);navigate('runs')}catch(error){toast(error.message)}}
async function runDurable(id){try{const result=await api(`/v1/workflows/${id}/run/durable`,{method:'POST',body:JSON.stringify({parameters:{market:'demo'}})});toast(`Temporal run queued · ${result.id.slice(0,8)}`);navigate('runs')}catch(error){toast(error.message)}}
async function cancelDurable(id){try{await api(`/v1/durable/runs/${id}/cancel`,{method:'POST',body:'{}'});toast('Cancellation requested');navigate('runs')}catch(error){toast(error.message)}}
async function changeSubscription(id,state){try{await api(`/v1/subscriptions/${id}`,{method:'PATCH',body:JSON.stringify({status:state,enabled:state==='active'})});toast(`Subscription ${state}`);navigate('subscriptions')}catch(error){toast(error.message)}}
let pendingProposal='';async function previewCommand(){const out=document.getElementById('agentResult');out.style.display='block';try{const result=await api('/v1/conversations/preview',{method:'POST',body:JSON.stringify({text:document.getElementById('agentCommand').value,channel:'web',thread_id:'console'})});out.textContent=JSON.stringify(result,null,2);pendingProposal=result.proposal_id||'';document.getElementById('confirmCommand').disabled=!pendingProposal}catch(error){out.textContent=error.message}}
async function confirmCommand(){if(!pendingProposal)return;try{const result=await api('/v1/conversations/confirm',{method:'POST',body:JSON.stringify({proposal_id:pendingProposal,confirmed:true})});toast('Agent action confirmed');pendingProposal='';document.getElementById('agentResult').textContent=JSON.stringify(result,null,2);document.getElementById('confirmCommand').disabled=true}catch(error){toast(error.message)}}
async function tickScheduler(){try{const result=await api('/v1/scheduler/tick',{method:'POST',body:'{}'});toast(`${result.executed.length} wake-up group(s) processed`);navigate('wakeups')}catch(error){toast(error.message)}}
navigate('overview');
</script>
</body></html>
