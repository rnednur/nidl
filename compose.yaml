services:
  nidl:
    build: .
    ports: ["8000:8000"]
    volumes: ["nidl_data:/data"]
    environment:
      NIDL_DB: /data/nidl.db
      NIDL_TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
  worker:
    build: .
    command: ["nidl-temporal-worker"]
    volumes: ["nidl_data:/data"]
    environment:
      NIDL_DB: /data/nidl.db
      NIDL_TEMPORAL_ADDRESS: temporal:7233
      NIDL_TEMPORAL_TASK_QUEUE: nidl-workflows
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
  temporal:
    image: temporalio/auto-setup:1.27.2
    ports: ["7233:7233"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes: ["temporal_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
  temporal-ui:
    image: temporalio/ui:2.34.0
    ports: ["8080:8080"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8000
    depends_on: [temporal]
volumes:
  nidl_data:
  temporal_data:
